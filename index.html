<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CY365 Web - ローカルカメラ録画</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #0a0a0a; color: #fff; min-height: 100vh; overflow: hidden;
        }
        .header {
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
            padding: 15px 20px; display: flex; justify-content: space-between; align-items: center;
            border-bottom: 1px solid #333; height: 70px;
        }
        .logo { display: flex; align-items: center; gap: 10px; }
        .logo-icon {
            width: 40px; height: 40px; background: linear-gradient(135deg, #00d4ff, #0099cc);
            border-radius: 10px; display: flex; align-items: center; justify-content: center;
            font-weight: bold; font-size: 18px;
        }
        .main-container { display: flex; height: calc(100vh - 70px); }
        .sidebar {
            width: 300px; background: #111; border-right: 1px solid #333;
            display: flex; flex-direction: column;
        }
        .sidebar-header { padding: 20px; border-bottom: 1px solid #333; }
        .connect-btn {
            width: 100%; padding: 12px; background: linear-gradient(135deg, #00d4ff, #0099cc);
            border: none; border-radius: 8px; color: #fff; font-weight: 600; cursor: pointer;
            transition: all 0.2s; margin-bottom: 10px;
        }
        .connect-btn:hover { transform: translateY(-2px); }
        .connect-btn:disabled { background: #333; cursor: not-allowed; }
        .device-list { flex: 1; overflow-y: auto; padding: 10px; }
        .device-item {
            padding: 15px; background: #1a1a1a; border-radius: 10px; margin-bottom: 10px;
            cursor: pointer; border: 2px solid transparent; transition: all 0.3s;
        }
        .device-item:hover { background: #222; }
        .device-item.active { border-color: #00d4ff; background: #1a2a3a; }
        .device-name { font-weight: 600; margin-bottom: 5px; }
        .device-info { font-size: 12px; color: #888; }
        .main-content { flex: 1; display: flex; flex-direction: column; }
        .video-container {
            flex: 1; position: relative; background: #000;
            display: flex; align-items: center; justify-content: center;
        }
        .video-placeholder {
            text-align: center; padding: 40px;
        }
        .camera-icon { font-size: 64px; margin-bottom: 20px; opacity: 0.3; }
        .no-signal { color: #666; margin-bottom: 10px; }
        .video-element {
            width: 100%; height: 100%; object-fit: contain; display: none; background: #000;
        }
        .video-element.active { display: block; }
        .recording-indicator {
            position: absolute; top: 20px; left: 20px;
            background: rgba(255, 68, 68, 0.9); padding: 8px 15px;
            border-radius: 20px; font-size: 12px; font-weight: 600; display: none;
            align-items: center; gap: 8px; z-index: 10;
        }
        .recording-indicator.active { display: flex; }
        .rec-dot { width: 8px; height: 8px; background: #fff; border-radius: 50%; animation: blink 1s infinite; }
        @keyframes blink { 0%, 100% { opacity: 1; } 50% { opacity: 0; } }
        .timestamp {
            position: absolute; top: 20px; right: 20px; background: rgba(0,0,0,0.7);
            padding: 8px 15px; border-radius: 5px; font-family: monospace; z-index: 10;
        }
        .controls-bar {
            background: #111; padding: 15px; display: flex; justify-content: center;
            gap: 30px; border-top: 1px solid #333;
        }
        .control-wrapper { position: relative; display: flex; flex-direction: column; align-items: center; }
        .control-btn {
            width: 50px; height: 50px; border-radius: 50%; border: none; background: #222;
            color: #fff; font-size: 20px; cursor: pointer; display: flex;
            align-items: center; justify-content: center; transition: all 0.3s;
        }
        .control-btn:hover:not(:disabled) { background: #333; transform: scale(1.1); }
        .control-btn.primary { background: linear-gradient(135deg, #00d4ff, #0099cc); }
        .control-btn.danger { background: #ff4444; }
        .control-btn:disabled { opacity: 0.3; cursor: not-allowed; }
        .control-label { position: absolute; bottom: -20px; font-size: 10px; color: #888; white-space: nowrap; }
        .bottom-panel {
            background: #111; border-top: 1px solid #333; padding: 15px;
            display: flex; gap: 20px; height: 220px;
        }
        .panel-section { flex: 1; background: #1a1a1a; border-radius: 10px; padding: 15px; overflow: hidden; display: flex; flex-direction: column; }
        .panel-title { font-size: 12px; color: #888; margin-bottom: 10px; display: flex; justify-content: space-between; }
        .snapshot-grid { display: flex; gap: 10px; overflow-x: auto; }
        .snapshot-item {
            width: 120px; height: 90px; background: #222; border-radius: 5px;
            flex-shrink: 0; display: flex; align-items: center; justify-content: center;
            font-size: 24px; color: #444; cursor: pointer; position: relative; overflow: hidden;
        }
        .snapshot-item img { width: 100%; height: 100%; object-fit: cover; }
        .log-list { font-size: 12px; color: #aaa; overflow-y: auto; flex: 1; }
        .log-item { padding: 4px 0; border-bottom: 1px solid #222; }
        .log-time { color: #00d4ff; margin-right: 8px; }
        .notification {
            position: fixed; top: 20px; right: 20px; background: #1a1a1a;
            border-left: 4px solid #00d4ff; padding: 15px 20px; border-radius: 8px;
            box-shadow: 0 5px 20px rgba(0,0,0,0.5); transform: translateX(400px);
            transition: transform 0.3s; z-index: 1001;
        }
        .notification.show { transform: translateX(0); }
        .download-list { display: flex; gap: 10px; overflow-x: auto; }
        .download-item {
            background: #222; padding: 10px; border-radius: 5px; font-size: 12px;
            display: flex; align-items: center; gap: 8px; white-space: nowrap;
        }
        .download-item a { color: #00d4ff; text-decoration: none; }
        @media (max-width: 768px) {
            .sidebar { width: 100%; position: fixed; bottom: 0; height: 200px; z-index: 100; }
            .main-content { margin-bottom: 200px; height: calc(100vh - 270px); }
            .bottom-panel { display: none; }
        }
    </style>
</head>
<body>
    <header class="header">
        <div class="logo">
            <div class="logo-icon">CY</div>
            <div style="font-size: 20px; font-weight: 600;">CY365 Web - ローカル録画</div>
        </div>
        <div id="statusText" style="font-size: 14px; color: #ff4444;">● 未接続</div>
    </header>

    <div class="main-container">
        <aside class="sidebar">
            <div class="sidebar-header">
                <div style="font-size: 12px; color: #888; margin-bottom: 10px;">カメラ接続</div>
                <button class="connect-btn" id="connectBtn" onclick="connectCamera()">🎥 PCカメラに接続</button>
                <button class="connect-btn" style="background: #ff4444; display: none;" id="disconnectBtn" onclick="disconnectCamera()">切断</button>
            </div>
            <div class="device-list">
                <div class="device-item active">
                    <div class="device-name">内蔵/外付けWebカメラ</div>
                    <div class="device-info">PCに接続されたカメラを使用</div>
                </div>
            </div>
        </aside>

        <main class="main-content">
            <div class="video-container">
                <div class="recording-indicator" id="recIndicator"><div class="rec-dot"></div>録画中 00:00</div>
                <div class="timestamp" id="clock">00:00:00</div>
                
                <div class="video-placeholder" id="placeholder">
                    <div class="camera-icon">📷</div>
                    <div class="no-signal">カメラ未接続</div>
                    <div style="color: #444; font-size: 14px;">「PCカメラに接続」をクリック</div>
                </div>
                <video class="video-element" id="video" autoplay playsinline muted></video>
            </div>

            <div class="controls-bar">
                <div class="control-wrapper">
                    <button class="control-btn" id="btnSnap" onclick="takeSnapshot()" disabled>📸</button>
                    <span class="control-label">スナップショット</span>
                </div>
                <div class="control-wrapper">
                    <button class="control-btn" id="btnRec" onclick="toggleRecording()" disabled>⏺</button>
                    <span class="control-label">録画開始/停止</span>
                </div>
                <div class="control-wrapper">
                    <button class="control-btn" onclick="downloadLastRecording()" id="btnDownload" disabled>💾</button>
                    <span class="control-label">最後の動画</span>
                </div>
            </div>

            <div class="bottom-panel">
                <div class="panel-section">
                    <div class="panel-title"><span>スナップショット履歴</span><span onclick="clearSnapshots()" style="cursor: pointer; color: #00d4ff;">クリア</span></div>
                    <div class="snapshot-grid" id="snapshots"></div>
                </div>
                <div class="panel-section">
                    <div class="panel-title"><span>録画ファイル</span></div>
                    <div class="download-list" id="recordings"></div>
                </div>
                <div class="panel-section">
                    <div class="panel-title">ログ</div>
                    <div class="log-list" id="logs"><div class="log-item"><span class="log-time">--:--:--</span>準備完了</div></div>
                </div>
            </div>
        </main>
    </div>

    <div class="notification" id="notif">
        <div style="font-weight: 600; margin-bottom: 5px;" id="notifTitle">通知</div>
        <div style="font-size: 13px; color: #aaa;" id="notifText">メッセージ</div>
    </div>

    <script>
        let stream = null;
        let mediaRecorder = null;
        let recordedChunks = [];
        let isRecording = false;
        let recordingInterval = null;
        let recordingSeconds = 0;
        let recordings = [];

        // 時計更新
        setInterval(() => {
            document.getElementById('clock').textContent = new Date().toLocaleString('ja-JP');
        }, 1000);

        // カメラ接続
        async function connectCamera() {
            try {
                stream = await navigator.mediaDevices.getUserMedia({ 
                    video: { 
                        width: { ideal: 1920 },
                        height: { ideal: 1080 }
                    }, 
                    audio: true 
                });
                
                const video = document.getElementById('video');
                video.srcObject = stream;
                video.classList.add('active');
                document.getElementById('placeholder').style.display = 'none';
                
                document.getElementById('connectBtn').style.display = 'none';
                document.getElementById('disconnectBtn').style.display = 'block';
                document.getElementById('statusText').textContent = '● 接続中';
                document.getElementById('statusText').style.color = '#00ff88';
                
                document.getElementById('btnSnap').disabled = false;
                document.getElementById('btnRec').disabled = false;
                
                showNotif('接続成功', 'カメラに接続しました');
                addLog('カメラに接続しました');
                
                // MediaRecorderの準備
                setupRecorder();
            } catch (err) {
                showNotif('エラー', 'カメラへのアクセスが拒否されました: ' + err.message);
                addLog('接続エラー: ' + err.message);
            }
        }

        // カメラ切断
        function disconnectCamera() {
            if (stream) {
                stream.getTracks().forEach(track => track.stop());
                stream = null;
            }
            
            document.getElementById('video').classList.remove('active');
            document.getElementById('placeholder').style.display = 'block';
            document.getElementById('connectBtn').style.display = 'block';
            document.getElementById('disconnectBtn').style.display = 'none';
            document.getElementById('statusText').textContent = '● 未接続';
            document.getElementById('statusText').style.color = '#ff4444';
            
            document.getElementById('btnSnap').disabled = true;
            document.getElementById('btnRec').disabled = true;
            document.getElementById('btnDownload').disabled = true;
            
            if (isRecording) stopRecording();
            
            showNotif('切断', 'カメラを切断しました');
            addLog('カメラを切断しました');
        }

        // MediaRecorderセットアップ
        function setupRecorder() {
            const mimeType = MediaRecorder.isTypeSupported('video/webm; codecs=vp9') 
                ? 'video/webm; codecs=vp9' 
                : 'video/webm';
            
            mediaRecorder = new MediaRecorder(stream, { mimeType });
            
            mediaRecorder.ondataavailable = (event) => {
                if (event.data.size > 0) {
                    recordedChunks.push(event.data);
                }
            };
            
            mediaRecorder.onstop = () => {
                const blob = new Blob(recordedChunks, { type: 'video/webm' });
                const url = URL.createObjectURL(blob);
                const timestamp = new Date().toISOString().replace(/[:.]/g, '-');
                const filename = `recording-${timestamp}.webm`;
                
                recordings.push({ url, filename, blob });
                
                // ダウンロードリストに追加
                const recDiv = document.createElement('div');
                recDiv.className = 'download-item';
                recDiv.innerHTML = `
                    <span>🎥</span>
                    <a href="${url}" download="${filename}">${filename}</a>
                    <span style="color: #888;">(${formatTime(recordingSeconds)})</span>
                `;
                document.getElementById('recordings').appendChild(recDiv);
                
                document.getElementById('btnDownload').disabled = false;
                showNotif('録画完了', '動画を保存しました: ' + filename);
                addLog('録画完了: ' + filename);
            };
        }

        // スナップショット
        function takeSnapshot() {
            const video = document.getElementById('video');
            const canvas = document.createElement('canvas');
            canvas.width = video.videoWidth;
            canvas.height = video.videoHeight;
            const ctx = canvas.getContext('2d');
            ctx.drawImage(video, 0, 0);
            
            const imgData = canvas.toDataURL('image/jpeg');
            const div = document.createElement('div');
            div.className = 'snapshot-item';
            div.innerHTML = `<img src="${imgData}">`;
            div.onclick = () => {
                const a = document.createElement('a');
                a.href = imgData;
                a.download = `snapshot-${Date.now()}.jpg`;
                a.click();
            };
            
            const grid = document.getElementById('snapshots');
            grid.insertBefore(div, grid.firstChild);
            
            if (grid.children.length > 6) grid.removeChild(grid.lastChild);
            
            showNotif('スナップショット', 'クリックでダウンロード');
            addLog('スナップショット撮影');
        }

        // 録画開始/停止
        function toggleRecording() {
            if (isRecording) {
                stopRecording();
            } else {
                startRecording();
            }
        }

        function startRecording() {
            recordedChunks = [];
            mediaRecorder.start();
            isRecording = true;
            recordingSeconds = 0;
            
            document.getElementById('btnRec').classList.add('danger');
            document.getElementById('recIndicator').classList.add('active');
            
            recordingInterval = setInterval(() => {
                recordingSeconds++;
                const m = String(Math.floor(recordingSeconds / 60)).padStart(2, '0');
                const s = String(recordingSeconds % 60).padStart(2, '0');
                document.querySelector('#recIndicator span:last-child').textContent = `録画中 ${m}:${s}`;
            }, 1000);
            
            showNotif('録画開始', '録画を開始しました');
            addLog('録画開始');
        }

        function stopRecording() {
            mediaRecorder.stop();
            isRecording = false;
            clearInterval(recordingInterval);
            
            document.getElementById('btnRec').classList.remove('danger');
            document.getElementById('recIndicator').classList.remove('active');
            document.querySelector('#recIndicator span:last-child').textContent = '録画中 00:00';
            
            showNotif('録画停止', '録画を停止しました');
            addLog('録画停止');
        }

        // 最後の録画をダウンロード
        function downloadLastRecording() {
            if (recordings.length > 0) {
                const last = recordings[recordings.length - 1];
                const a = document.createElement('a');
                a.href = last.url;
                a.download = last.filename;
                a.click();
            }
        }

        function clearSnapshots() {
            document.getElementById('snapshots').innerHTML = '';
            addLog('スナップショットをクリア');
        }

        function addLog(msg) {
            const t = new Date().toLocaleTimeString('ja-JP');
            const logs = document.getElementById('logs');
            const item = document.createElement('div');
            item.className = 'log-item';
            item.innerHTML = `<span class="log-time">${t}</span>${msg}`;
            logs.insertBefore(item, logs.firstChild);
        }

        function showNotif(title, text) {
            document.getElementById('notifTitle').textContent = title;
            document.getElementById('notifText').textContent = text;
            document.getElementById('notif').classList.add('show');
            setTimeout(() => document.getElementById('notif').classList.remove('show'), 3000);
        }

        function formatTime(sec) {
            const m = Math.floor(sec / 60);
            const s = sec % 60;
            return `${m}分${s}秒`;
        }

        // ページ離脱時に録画停止
        window.onbeforeunload = () => {
            if (isRecording) mediaRecorder.stop();
        };
    </script>
</body>
</html>
